{% extends 'base.html' %}

{% block title %}Exam{% endblock %}

{% block content %}
    <h2>Exam</h2>
    <form method="POST">
        {% for question in questions %}
            <div class="question">
                <h3>{{ question.id }}. {{ question.question }}</h3>
                <div class="options">
                    {% for option in question.options %}
                        <div>
                            <input type="radio" id="option_{{ question.id }}_{{ loop.index }}" name="question_{{ question.id }}" value="{{ option }}" required>
                            <label for="option_{{ question.id }}_{{ loop.index }}">{{ option }}</label>
                        </div>
                    {% endfor %}
                </div>
            </div>
        {% endfor %}
        <button type="submit">Submit Exam</button>
    </form>
{% endblock %}
